[project]
name = "truecoach-mcp"
version = "1.1.0"
description = "Connect TrueCoach to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No TrueCoach API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["truecoach", "truecoach api", "truecoach mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/truecoach-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=truecoach"
Source = "https://github.com/cotlet-connect/truecoach-mcp"

[project.scripts]
truecoach-mcp = "truecoach_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"truecoach_agent.py" = "truecoach_agent.py"

[tool.hatch.build.targets.sdist]
include = ["truecoach_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
